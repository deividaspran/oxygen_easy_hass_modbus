name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build HACS archive
        run: zip -r oxygen_easy_modbus.zip custom_components/oxygen_easy_modbus
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: oxygen_easy_modbus.zip
          generate_release_notes: true
